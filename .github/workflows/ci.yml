name: CI

on:
  push:
    branches: [main]
  pull_request:
  # bmlib is pinned to a released tag in pyproject.toml, so a push to bmlib no
  # longer reaches CI on its own. Everything else still does: the jobs below
  # install with `uv pip install -e` and no lock file (uv.lock is gitignored),
  # so httpx, click, jinja2, bmlib's own dependencies and the dev tools are all
  # resolved fresh on every run. A release of any of them can break bmnews with
  # no change to bmnews at all, and this scheduled run surfaces that within a
  # week instead of at the start of the next unrelated pull request. It also
  # covers the one way bmlib can still move under the pin: a git tag is
  # mutable, so a re-pointed v0.6.0 would be picked up silently.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A new push to the same branch makes older runs irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installed via the standalone script rather than a setup action:
      # astral-sh/setup-uv no longer publishes moving major tags, so pinning it
      # means pinning an exact version that then needs bumping. CLAUDE.md also
      # asks for uv rather than pip for anything touching packages.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create environment
        run: |
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The dev extra is enough to lint; the GUI extra only matters for tests.
      - name: Install project
        run: uv pip install -e ".[dev]"

      - name: ruff check
        run: ruff check bmnews/ tests/

      # Gating. The tree was formatted in one sweep, so a failure here now means
      # the pull request's own diff is unformatted: run `ruff format bmnews/
      # tests/` and commit the result.
      - name: ruff format --check
        run: ruff format --check bmnews/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the result on the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The GUI extra brings in Flask, which tests/test_gui_app.py needs. The
      # postgresql extra is left out here on purpose: without
      # BMNEWS_TEST_PG_DSN the PostgreSQL parameterisation skips, so installing
      # psycopg2 on all three versions would buy nothing. The test-postgresql
      # job below is where that backend is exercised.
      - name: Install project
        run: uv pip install -e ".[gui,dev]"

      - name: Run tests
        run: python -m pytest -q

  # A separate job rather than another axis on the matrix above. The two ask
  # different questions — the matrix asks "does bmnews work on this Python?",
  # this asks "does bmnews work on this database?" — and crossing them would
  # triple the PostgreSQL containers for no extra answer. It also keeps the
  # failure legible: a red check here means a backend problem, not a version
  # problem.
  test-postgresql:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bmnews
          POSTGRES_PASSWORD: bmnews
          POSTGRES_DB: bmnews_test
        ports:
          - 5432:5432
        # Without this the job races the container: the first connection
        # attempt can arrive before the server is accepting them. `-d` is not
        # optional noise — without it pg_isready connects to a database named
        # after the user, which does not exist here, and the container log
        # fills with FATAL lines. The probe still passes (pg_isready reports
        # ready whenever the server *responds*, rejection included), so the
        # effect is a check that looks like it verifies the test database and
        # does not.
        options: >-
          --health-cmd "pg_isready -U bmnews -d bmnews_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create environment
        run: |
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install project
        run: uv pip install -e ".[gui,dev,postgresql]"

      # A bad DSN or a container that never started shows up as a failure, so
      # those need no guard. What would pass quietly is the parameterisation
      # going missing — drop the `pytestmark` from tests/test_db.py and this
      # job runs a SQLite-only suite and reports success. Collection is
      # independent of the DSN, so this check needs no database.
      #
      # Scoped to tests/test_db.py, not the whole suite: once any other module
      # opts into `db_backend`, a suite-wide count stays above zero while the
      # module this job exists for has quietly stopped being parameterised.
      # The floor is well under the current count so ordinary test-writing
      # does not trip it, and well above zero so losing the mark does.
      - name: Assert the PostgreSQL parameterisation still exists
        run: |
          count=$(python -m pytest -q --collect-only tests/test_db.py 2>/dev/null \
                  | grep -c '\[postgresql\]' || true)
          echo "collected $count PostgreSQL-parameterised tests in tests/test_db.py"
          test "$count" -ge 70

      # Setting the DSN is what un-skips the PostgreSQL parameterisation, so
      # the whole suite runs and tests/test_db.py runs twice — once per
      # backend.
      - name: Run tests
        env:
          BMNEWS_TEST_PG_DSN: postgresql://bmnews:bmnews@localhost:5432/bmnews_test
        run: python -m pytest -q
